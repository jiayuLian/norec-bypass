name: build

# 产出：NoRecBypass.dylib —— 用 TrollFools 注入抖音
#
# 为什么跑在 macos-latest：Windows 上没有 clang / iPhoneOS SDK，
# 只能借 macOS runner 用 Xcode 自带工具链编（一次过，不用自己搭 Linux 交叉链）。
#
# 注意：public 仓库的 macOS runner 免费无限；private 仓库要烧付费额度。
# 所以这个仓库保持 public。
#
# 链接依赖（实际由 Makefile 的 NoRecBypass_FRAMEWORKS 指定，这里同步一份给静态检查）：
#   -framework Foundation
# UIKit / AVFoundation 的类一律走 NSClassFromString，不做符号引用，故不链。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dylib:
    name: 编译 dylib
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Theos + iOS SDK + ldid
        run: |
          set -e
          export THEOS="$HOME/theos"
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          mkdir -p "$THEOS/sdks"
          cp -r /tmp/theos-sdks/iPhoneOS*.sdk "$THEOS/sdks/"
          echo "--- sdks ---"; ls -1 "$THEOS/sdks"
          echo "--- xcode ---"; xcodebuild -version
          echo "--- clang ---"; clang --version | head -2

          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid || {
              mkdir -p "$HOME/bin"
              for a in ldid_macosx_arm64 ldid_macosx_universal ldid_macosx_x86_64; do
                if curl -fsSL -o "$HOME/bin/ldid" \
                   "https://github.com/ProcursusTeam/ldid/releases/latest/download/$a"; then
                  chmod +x "$HOME/bin/ldid"; break
                fi
              done
              echo "$HOME/bin" >> "$GITHUB_PATH"
            }
          fi
          echo "--- ldid ---"
          command -v ldid && (ldid -h 2>&1 | head -2 || true)

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: 版本号
        run: |
          set -e
          VER=$(python3 -c "import re;m=re.search(r'NRC_VERSION\s+@\"([^\"]+)\"',open('Tweak.m',encoding='utf-8').read());print(m.group(1) if m else '')")
          if [ -z "$VER" ]; then echo "::error::Tweak.m 里找不到 NRC_VERSION"; exit 1; fi
          echo "NRC_VER=$VER" >> "$GITHUB_ENV"
          echo "版本 = $VER"

      - name: 编译
        run: |
          set -e
          make clean || true
          make -j"$(sysctl -n hw.ncpu)" || {
            echo "::warning::make 失败，列出 .theos 残留"
            find .theos -name '*.dylib*' -exec ls -l {} \; || true
            exit 1
          }
          echo "--- 产物 ---"
          find .theos -type f -name '*NoRecBypass*.dylib' -not -path '*.dSYM/*' -exec ls -l {} \;

          DYLIB=$(find .theos -type f -name '*NoRecBypass*.dylib' -not -path '*.dSYM/*' | head -1)
          echo "--- 文件类型（必须是 dynamically linked shared library）---"
          file -b "$DYLIB"
          echo "--- 加载命令 ---"
          otool -L "$DYLIB"

          # 硬闸：TrollStore/TrollFools 不是越狱，设备上不存在 CydiaSubstrate。
          # dylib 只要带这条依赖，dyld 加载期直接失败、抖音起不来。
          if otool -L "$DYLIB" | grep -qi 'substrate'; then
            echo "::error::dylib 仍依赖 CydiaSubstrate —— 检查是否混进了 Logos 代码"
            exit 1
          fi
          echo "OK: 无 substrate 依赖"

          # 版本断言：确认编的确实是当前 Tweak.m，不是旧缓存
          if ! grep -aq "NRC_VERSION" "$DYLIB" && ! grep -aq "$NRC_VER" "$DYLIB"; then
            echo "::error::dylib 内找不到版本标记"
            exit 1
          fi
          echo "OK: 版本标记已在 dylib 内"

      - name: 收集 dylib
        run: |
          set -e
          mkdir -p out
          # 坑：dSYM bundle 里也有同名文件（filetype 10，不是 dylib），必须排除
          DYLIB=$(find .theos -type f -name '*NoRecBypass*.dylib' -not -path '*.dSYM/*' | head -1)
          if [ -z "$DYLIB" ]; then
            echo "::error::没找到 NoRecBypass.dylib"
            find .theos -name '*NoRecBypass*' -exec ls -l {} \;
            exit 1
          fi
          cp "$DYLIB" out/NoRecBypass.dylib
          ls -l out/
          case "$(file -b out/NoRecBypass.dylib)" in
            *"dynamically linked shared library"*) echo "OK: MH_DYLIB" ;;
            *) echo "::error::产物不是 dylib（很可能拷成了 dSYM）"; exit 1 ;;
          esac

          # ---------------------------------------------------------------
          # 【必须】ad-hoc 代码签名。
          #
          # Theos 产出的 dylib 默认【没有】LC_CODE_SIGNATURE 这条加载命令。
          # 而未签名的 dylib 在 iOS 上会被签名校验直接拒掉，dyld 加载失败
          # → 宿主（抖音）秒退。
          #
          # 这正是「NrcStub（签过 ldid）能跑、NoRecBypass（没签）闪退」
          # 的唯一结构性差异：
          #   NoRecBypass v1.0.2/v1.0.3 : LC_CODE_SIGNATURE = 无
          #   NrcStub                  : LC_CODE_SIGNATURE = 有
          # 其余（SDK 26.5 / platform iOS / minos 14.0 / arm64）完全一致。
          # ---------------------------------------------------------------
          ldid -S out/NoRecBypass.dylib
          if ! otool -l out/NoRecBypass.dylib | grep -q LC_CODE_SIGNATURE; then
            echo "::error::签名后仍然没有 LC_CODE_SIGNATURE，抖音注入后会被拒"
            exit 1
          fi
          echo "OK: 已签名（LC_CODE_SIGNATURE 存在）"

      - name: 编译诊断 dylib（NrcStub + NrcProbe）
        run: |
          set -e
          # 这两个都是「一次注入就能定位问题」用的：
          #   NrcStub  —— 全文件只有一个裸 write(2)。注入它仍闪退 ⇒ 问题在注入本身。
          #   NrcProbe —— 阶梯式，每一级只做一件事并打日志（[P0]~[P7]）。
          #               看日志最后停在哪一级，就知道崩点在哪。
          # 两者都用 clang 直接编（不走 Theos），且都必须 ldid 签名 —— 不加
          # LC_CODE_SIGNATURE 的话 iOS 会拒绝加载，那就白测了。
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"

          build_one () {
            SRC="$1"; OUT="$2"; shift 2
            xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
              -isysroot "$SDK" \
              -miphoneos-version-min=14.0 \
              -fobjc-arc -O2 \
              "$@" \
              -framework Foundation \
              -o "$OUT" "$SRC"
            echo "--- $OUT ---"
            file -b "$OUT"
            otool -L "$OUT"
            if otool -L "$OUT" | grep -qi 'substrate'; then
              echo "::error::$OUT 不该有任何 substrate 依赖"
              exit 1
            fi
            ldid -S "$OUT"
            if ! otool -l "$OUT" | grep -q LC_CODE_SIGNATURE; then
              echo "::error::$OUT 签名失败，缺少 LC_CODE_SIGNATURE"
              exit 1
            fi
            echo "OK: $OUT 已签名"
          }

          build_one Stub.m  out/NrcStub.dylib
          build_one Probe.m out/NrcProbe.dylib

          # ---- NrcLite 三梯度：把「工具链」这个变量也换掉（clang 直编，不经 Theos）----
          #   0 = 不装 hook      1 = 构造期装      2 = +3s 装
          build_one Lite.m out/NrcLite0.dylib    -DNRC_MODE=0
          build_one Lite.m out/NrcLite.dylib     -DNRC_MODE=1
          build_one Lite.m out/NrcLiteLate.dylib -DNRC_MODE=2
          echo "--- 校验三个 Lite 的模式标记 ---"
          for f in out/NrcLite0.dylib out/NrcLite.dylib out/NrcLiteLate.dylib; do
            if ! grep -aq 'NrcLite/1.0.5/mode=' "$f"; then
              echo "::error::$f 里找不到模式标记，可能编错源文件"
              exit 1
            fi
            printf '%-26s ' "$f"; strings "$f" | grep -m1 'NrcLite/1.0.5/mode='
          done
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: NoRecBypass-${{ env.NRC_VER }}-dylib
          path: out/*.dylib
          if-no-files-found: error

      - name: 发 Release（手机可直接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dylib-latest
          name: NoRecBypass ${{ env.NRC_VER }}
          files: |
            out/NoRecBypass.dylib
            out/NrcStub.dylib
            out/NrcProbe.dylib
            out/NrcLite0.dylib
            out/NrcLite.dylib
            out/NrcLiteLate.dylib
          fail_on_unmatched_files: true
          body: |
            NoRecBypass ${{ env.NRC_VER }} —— 抖音小程序录屏限制绕过 + 进程内流量取证。

            ## ⚠️ 先看这个：注入抖音闪退，请改用 NrcLite 三梯度包

            已知：`NrcStub.dylib` 注入正常，`NoRecBypass.dylib` 注入闪退。
            两者之间差的不止一样东西（Theos 工具链 / UIKit 链接 / 全量类清扫 /
            NSURLSession hook / socket 服务），所以一次改一堆定位不到。

            `NrcLite*` 把差异压到极限：**clang 直编、不经 Theos、只链 Foundation、
            只 hook 一个方法 `-[UIScreen isCaptured]`**。三个梯度：

            | 文件 | 行为 | 崩了说明什么 | 正常说明什么 |
            |---|---|---|---|
            | `NrcLite0.dylib` | 完全不装 hook | 连 Foundation/ObjC 链接都不行 | 加载路径没问题 |
            | `NrcLite.dylib` | 构造期就装 hook | 抖音启动早期就因「系统类被改」而死 | 早装可行 ✅ |
            | `NrcLiteLate.dylib` | App 起来 +3s 才装 | 抖音的完整性校验在启动之后 | 晚装可行 ✅ |

            只要有一个能跑，录屏绕过这件事就成立了，剩下的都是加法。

            ## 五个/六个文件，用途一览

            * `NrcLite0.dylib` / `NrcLite.dylib` / `NrcLiteLate.dylib` —— 见上表，**优先试这三个**
            * `NoRecBypass.dylib` —— 完整版主程序（录屏绕过 + 网络取证 + HTTP 日志服务）
            * `NrcProbe.dylib` —— 阶梯式诊断版，日志 `[P0]`~`[P7]`，看停在哪一级
            * `NrcStub.dylib` —— 空壳，只有一个裸 `write(2)`，对照用

            全部产物都已 `ldid -S` ad-hoc 签名（缺 `LC_CODE_SIGNATURE` 会被 iOS 拒载）。
            注入方式：TrollFools → 抖音 → 注入 dylib，每次换包前先 Uninject 再完整杀进程。
